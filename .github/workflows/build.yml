name: Build and Release RATools-for-PDF

on:
  push:
    tags:
      - 'v*' # 仅在推送以 'v' 开头的 tag 时触发（例如 v1.0.0, v2.1.3）
  workflow_dispatch: # 保留手动触发功能供测试使用

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # 必须授予写入权限，Action 才能在仓库中创建 Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run regression tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Run Build Script
      shell: cmd
      run: |
        build_pyinstaller.bat

    - name: Resolve build version
      shell: pwsh
      run: |
        $version = python -c "from ratools_pdf.config.version import APP_VERSION_STR; print(APP_VERSION_STR)"
        "APP_VERSION_STR=$version" >> $env:GITHUB_ENV

    - name: Extract release notes from CHANGELOG
      shell: cmd
      run: |
        python scripts/extract_release_notes.py --version %APP_VERSION_STR% --changelog CHANGELOG.md --output release_notes.md

    - name: Zip Artifacts
      # Windows 运行器默认使用 PowerShell，直接调用 Compress-Archive 进行压缩
      run: |
        Compress-Archive -Path "dist\RATools-for-PDF_v${env:APP_VERSION_STR}" -DestinationPath "RATools-for-PDF_v${env:APP_VERSION_STR}.zip"
        Compress-Archive -Path "dist\RATools-for-PDF-NoUpdate_v${env:APP_VERSION_STR}" -DestinationPath "RATools-for-PDF-NoUpdate_v${env:APP_VERSION_STR}.zip"

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' # 由 tag 触发或者手动 run wrokflow 时执行发布步骤
      with:
        tag_name: v${{ env.APP_VERSION_STR }}
        files: |
          RATools-for-PDF_v${{ env.APP_VERSION_STR }}.zip
          RATools-for-PDF-NoUpdate_v${{ env.APP_VERSION_STR }}.zip
        body_path: release_notes.md # 注入 CHANGELOG 中当前版本的小节；找不到时为空文件
        generate_release_notes: true # 自动追加基于 PR 和 commit 历史的发布说明
