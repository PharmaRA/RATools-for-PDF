name: Build and Release RATools-for-PDF

on:
  push:
    tags:
      - 'v*' # 仅在推送以 'v' 开头的 tag 时触发（例如 v1.0.0, v2.1.3）
  workflow_dispatch: # 保留手动触发功能供测试使用

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # 必须授予写入权限，Action 才能在仓库中创建 Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c requirements-nuitka.constraints.txt
        pip install -U nuitka ordered-set zstandard

    - name: Run regression tests
      run: |
        python -X utf8 -X faulthandler -B scripts/run_tests_safely.py

    - name: Run Build Script (Nuitka)
      shell: cmd
      run: |
        build_nuitka.bat
    - name: Resolve build version
      shell: pwsh
      run: |
        $version = python -c "from ratools_pdf.config.version import APP_VERSION_STR; print(APP_VERSION_STR)"
        "APP_VERSION_STR=$version" >> $env:GITHUB_ENV

    - name: Extract release notes from CHANGELOG
      shell: cmd
      run: |
        python scripts/extract_release_notes.py --version %APP_VERSION_STR% --changelog CHANGELOG.md --output release_notes.md

    - name: Zip Artifacts
      # 标准 Deflate 最高压缩级别，并逐文件验证 ZIP 内的保留内容。
      run: |
        python -B scripts/package_nuitka_release.py zip --source "dist\RATools-for-PDF_v${env:APP_VERSION_STR}" --output "RATools-for-PDF_v${env:APP_VERSION_STR}.zip"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -B scripts/package_nuitka_release.py zip --source "dist\RATools-for-PDF-NoUpdate_v${env:APP_VERSION_STR}" --output "RATools-for-PDF-NoUpdate_v${env:APP_VERSION_STR}.zip"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' # 由 tag 触发或者手动 run wrokflow 时执行发布步骤
      with:
        tag_name: v${{ env.APP_VERSION_STR }}
        files: |
          RATools-for-PDF_v${{ env.APP_VERSION_STR }}.zip
          RATools-for-PDF-NoUpdate_v${{ env.APP_VERSION_STR }}.zip
        body_path: release_notes.md # 注入 CHANGELOG 中当前版本的小节；找不到时为空文件
        generate_release_notes: true # 自动追加基于 PR 和 commit 历史的发布说明
        make_latest: true # 显式将本次发布标记为 Latest，不依赖 GitHub 的自动判定
